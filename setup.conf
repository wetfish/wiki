# What the wiki needs on a wetfish/server; see "Project Setup" in
# https://github.com/wetfish/server/blob/main/docs/how-it-works.md
#
# php.env starts as a copy of php.env.example, so everything not listed here
# keeps its example value. Edit config/wiki/php.env on the server to change
# a value, such as to keep an existing wiki's passwords, then deploy again.

# <env file> <variable> <value>
php.env DB_HOSTNAME     database host
php.env DB_DATABASE     database name
php.env DB_USERNAME     database user
php.env DB_PASSWORD     database password
php.env SITE_URL        domain

# never empty, since login.php accepts an empty password when one is empty
php.env LOGIN_PASSWORD  random hex 16
php.env ADMIN_PASSWORD  random hex 16
php.env BAN_PASSWORD    random hex 16

php.env CAPTCHA_BYPASS  secret Regex that skips the captcha on the API, empty for none

# creates the wiki's tables when a deploy first creates its database;
# never runs against a database that already exists
schema database/schema.sql
