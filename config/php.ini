; the wiki's own php settings, loaded on top of php.ini-production

; don't advertise the php version in headers
expose_php = Off

; mitigation for CVE-2026-115560 until php ships a fix;
; the wiki uses sessions and takes uploads, so this matters here
session.upload_progress.enabled = 0

; uploads of images, audio, and video, see client_max_body_size in config/nginx.conf
upload_max_filesize = 32M
post_max_size = 32M

date.timezone = UTC
