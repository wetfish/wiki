; the wiki's own php settings, loaded on top of php.ini-production

; don't advertise the php version in headers
expose_php = Off

; workaround for session file corruption (CVE-2026-126714), kept on top of
; the php 8.5.13 fixes; the wiki uses sessions and takes uploads, but never
; shows upload progress
session.upload_progress.enabled = 0

; mitigation for use-after-free bugs in fatal error backtraces
; (CVE-2026-109619, CVE-2026-129182); turn back on locally for debugging
fatal_error_backtraces = 0

; uploads of images, audio, and video, see client_max_body_size in config/nginx.conf
upload_max_filesize = 32M
post_max_size = 32M

date.timezone = UTC
