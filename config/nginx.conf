server {
    listen 80;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/;

    # hide the nginx version
    server_tokens off;

    # php takes uploads up to 32 MB, see config/php.ini
    client_max_body_size 64M;

    # real visitor ip, sent by the wetfish/server proxy
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # docker's dns server; a variable in fastcgi_pass makes nginx look php up
    # again when it expires, so it finds the new container after a deploy
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_upstream php:9000;

    # no dotfiles or package manifests
    location ~ /\. {
        return 404;
    }

    location ~ (^|/)package(-lock)?\.json$ {
        return 404;
    }

    location / {
        autoindex on;
        try_files $uri $uri/ /index.php;
    }

    location /api {
        autoindex off;
        try_files $uri $uri/ /index.php;
    }

    location /api/v1 {
        try_files $uri $uri/ /api/v1/index.php;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
