# local development only, server deploys skip this file
services:
  # httpd
  nginx:
    # normally behind the shared caddy proxy from wetfish/server
    ports:
      - "127.0.0.1:2405:80"

  # php-fpm
  php:
    depends_on:
      - db

  # database; on a server the wiki uses the shared database from
  # wetfish/server instead, which runs this version in strict sql mode
  db:
    image: docker.io/mariadb:12.3.3
    restart: unless-stopped
    # see mariadb.env.example
    env_file:
      - ./mariadb.env
    volumes:
      - db:/var/lib/mysql
      # creates the wiki's tables the first time the db volume is created
      - ./wwwroot/src/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    # for database tools on your computer
    ports:
      - "127.0.0.1:3405:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db:
