# deployed with wetfish/server, see README.md
services:
  # httpd
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    # nginx needs php running before it starts
    depends_on:
      - php
    volumes:
      # user uploads, shared with php
      - uploads:/var/www/upload
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/robots.txt"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # php-fpm
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    restart: unless-stopped
    # db connection info and passwords; written from setup.conf on a server,
    # copied from php.env.example for local development
    env_file:
      - ./php.env
    volumes:
      # user uploads, written by upload.php and image rehosting, plus thumbnails
      - uploads:/var/www/upload
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

# the database is the shared one from wetfish/server on a server, and the db
# service in docker-compose.override.yml for local development

volumes:
  # named wiki_uploads on a server, after the project
  uploads:
